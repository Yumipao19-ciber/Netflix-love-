<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVEFLIX</title>

<style>
body {
    margin: 0;
    background-color: #000;
    font-family: Arial, sans-serif;
    color: white;
}

/* MENÚ SUPERIOR */
header {
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    background: rgba(0,0,0,0.7);
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 10;
}

header h1 {
    color: #e50914;
    font-size: 28px;
    margin: 0;
}

nav a {
    margin-left: 20px;
    color: white;
    text-decoration: none;
    font-size: 16px;
}

/* PORTADA */
.portada {
    width: 100%;
    height: 70vh;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
    padding: 40px;
    box-shadow: inset 0 -150px 150px rgba(0,0,0,0.7);
}

/* TEXTO PORTADA */
.portada h2 {
    font-size: 40px;
    margin: 0;
}

.portada p {
    max-width: 500px;
    font-size: 16px;
    margin-top: 10px;
}

/* BOTONES */
.botones button {
    background-color: #e50914;
    border: none;
    padding: 12px 25px;
    margin-right: 10px;
    margin-top: 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

.botones button:nth-child(2) {
    background-color: rgba(255,255,255,0.3);
}

/* EPISODIOS */
#episodios {
    padding: 20px;
}

#episodios h3 {
    margin-left: 10px;
}

.ep-lista {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px;
}

.ep-lista img {
    width: 220px;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.3s;
}

.ep-lista img:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<header>
    <h1>LOVEFLIX</h1>
    <nav>
        <a href="#">Inicio</a>
        <a href="#">Series</a>
        <a href="#">Música</a>
        <a href="#">Mi lista</a>
    </nav>
</header>

<!-- PORTADA AUTOMÁTICA -->
<div class="portada" id="portada">
    <div>
        <h2>Feliz cumpleaños ❤️</h2>
        <p>
            Un esposo que ilumina cada escena con su bondad, su fuerza y su forma única de amar.
            En este episodio especial de cumpleaños, la vida nos regala otro capítulo lleno de
            gratitud, abrazos y momentos que merecen repetirse.
        </p>

        <div class="botones">
            <button>Reproducir</button>
            <button>Más información</button>
        </div>
    </div>
</div>

<!-- EPISODIOS -->
<section id="episodios">
    <h3>Episodios</h3>
    <div class="ep-lista" id="listaEpisodios"></div>
</section>

<script>
// CARGAR PORTADA AUTOMÁTICA
const portada = document.getElementById("portada");

// Foto principal (foto1)
portada.style.backgroundImage = "url('images/foto1.jpg')";

// CARGAR EPISODIOS AUTOMÁTICOS
const lista = document.getElementById("listaEpisodios");

const fotos = [
    "images/foto2.jpg",
    "images/foto3.jpg",
    "images/foto4.jpg",
    "images/foto5.jpg",
    "images/foto6.jpg",
    "images/foto7.jpg",
    "images/foto8.jpg"
];

fotos.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.onerror = () => {};
    lista.appendChild(img);
});
</script>

</body>
</html>
